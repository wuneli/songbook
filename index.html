<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Songbook</title>
<meta name="description" content="Songtexte mit Akkorden">
<meta name="theme-color" content="#1d1b19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Songbook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script>
  // apply theme before first paint
  try { const t = JSON.parse(localStorage.getItem('sb.settings') || '{}').theme; if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch {}
</script>
<script type="module" src="app.js"></script>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
